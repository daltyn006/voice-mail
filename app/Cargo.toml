[package]
publish = false
name = "voice-mail"
version = "1.0.2"
edition = "2021"

[[bin]]
name = "voice-mail"
path = "src/main.rs"

[dependencies]
# UI pins (see PINS.md): depend on the gpui-kit facade ONLY — it re-exports
# the matching gpui-pre/gpui-component set, so no version can drift apart.
# Code says `use gpui_kit::...` throughout; direct gpui deps are banned.
gpui-kit = "=0.6.4"
pv-backend = { path = "../pv-backend" }
# Native file dialogs (replaces the Tauri dialog plugin).
rfd = "0.17"
# Backend→UI event bridge (blocking backend rx, async UI task).
async-channel = "2"

[build-dependencies]
# Windows exe icon (app.rc → assets/voice-mail.ico).
embed-resource = "=3.0.11"

[dev-dependencies]
# Headless UI tests only (`TestApp`): the facade forwards `test-support` to
# the matched gpui stack. Still facade-only per PINS.md — never depend on raw
# gpui crates directly. Test builds only; normal builds are unaffected.
gpui-kit = { version = "=0.6.4", features = ["test-support"] }

# ---- cargo-packager config (M5): NSIS per-machine exe + per-user MSI ----
# Paths are relative to this file. NSIS/Wix place `resources` beside the exe,
# which matches the exe-dir-first resolution in pv-backend + audio_ffmpeg.
# Program only: no models/, no scripts/ — models install separately via the
# in-app downloader, then the app runs fully offline.
[package.metadata.packager]
product-name = "voice mail"
version = "1.0.2"
identifier = "com.presentvoice.app"
description = "Batch transcribe + summarize lectures. Works fully offline after models."
category = "Productivity"
formats = ["nsis", "wix"]
out-dir = "../dist"
binaries-dir = "../target/release"
icons = ["../assets/voice-mail.ico", "../assets/voice-mail.png"]

[[package.metadata.packager.binaries]]
path = "voice-mail"
main = true

[[package.metadata.packager.resources]]
src = "../ffmpeg-dlls/*"
target = "."

[[package.metadata.packager.resources]]
src = "../config/models.json"
target = "models.json"

[[package.metadata.packager.resources]]
src = "../config/guides/recap.md"
target = "guides/recap.md"

[[package.metadata.packager.resources]]
src = "../config/guides/standard.md"
target = "guides/standard.md"

[[package.metadata.packager.resources]]
src = "../config/guides/detailed.md"
target = "guides/detailed.md"

[package.metadata.packager.nsis]
installMode = "perMachine"
installer-icon = "../assets/voice-mail.ico"
# Per-machine single folder: grant standard users write access up front
# (inheritance covers files copied later), so models/output work for everyone.
# Uninstaller offers to remove $LOCALAPPDATA data via appdata-paths.
preinstall-section = """
    Section PreInstall
      CreateDirectory $INSTDIR
      ExecWait 'icacls "$INSTDIR" /grant *S-1-5-32-545:(OI)(CI)M /T'
    SectionEnd
"""
appdata-paths = ["$LOCALAPPDATA/voice mail"]

# MSI-single (full per-machine installer) + the feed-driven update path both
# rely on this stable upgrade code: reinstalling a newer MSI is a major
# upgrade, never a second install. NEVER change this GUID.
[package.metadata.packager.wix]
upgrade-code = "D8E1D4F5-7BC7-4B9C-A97E-F896B2E186B7"
